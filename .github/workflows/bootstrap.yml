name: Bootstrap Atlas Global Frontend

on:
  push:
    branches:
      - feat/official-homepage-v1
    paths:
      - .bootstrap/project.tar.gz.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-homepage-v1
          fetch-depth: 0

      - name: Expand the approved frontend source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/project.tar.gz.b64 > /tmp/atlas-project.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.bootstrap' -exec rm -rf {} +
          tar -xzf /tmp/atlas-project.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit generated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-global-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): implement official Atlas Global homepage v1"
          git push origin HEAD:feat/official-homepage-v1
