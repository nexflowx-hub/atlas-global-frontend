name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/official-homepage-v1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint -- --format json --output-file eslint-report.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: |
          cat eslint-report.json
          exit 1

      - name: Production build
        run: npm run build

      - name: Runtime smoke test and visual captures
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/atlas-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/atlas-home.html; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              cat /tmp/atlas-next.log
              exit 1
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "A Chromium-compatible browser is unavailable on this runner."
            exit 1
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,2400 --virtual-time-budget=3500 --screenshot=atlas-desktop.png http://127.0.0.1:3000/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,1200 --virtual-time-budget=3500 --screenshot=atlas-mobile.png http://127.0.0.1:3000/

          test -s atlas-desktop.png
          test -s atlas-mobile.png

      - name: Upload visual QA captures
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-qa
          path: |
            atlas-desktop.png
            atlas-mobile.png
          if-no-files-found: error

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock
          path: package-lock.json
          if-no-files-found: error
